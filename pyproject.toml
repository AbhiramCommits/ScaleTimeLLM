[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scaletimellm"
version = "0.1.0"
description = "Empirical inference-time scaling for reasoning and code with small open LLMs"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "ScaleTimeLLM contributors"}]
keywords = ["llm", "inference-time-compute", "reasoning", "self-consistency", "verifier"]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "pandas>=2.0",
  "matplotlib>=3.7",
  "PyYAML>=6.0",
  "torch>=2.1",
  "transformers>=4.40",
  "datasets>=2.18",
  "trl>=0.9",
  "scikit-learn>=1.3",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]
vllm = ["vllm>=0.5"]
logging = ["wandb>=0.17"]

[project.scripts]
scaletimellm = "scaletimellm.cli:main"

[tool.setuptools.packages.find]
include = ["scaletimellm*"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".venv", ".hf_cache", "artifacts", "results/raw"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "SIM108", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::UserWarning",
]

[tool.coverage.run]
source = ["scaletimellm"]
omit = ["scaletimellm/backends/vllm_backend.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
