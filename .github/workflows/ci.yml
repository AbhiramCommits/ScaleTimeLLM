name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test with coverage
        run: pytest -q --cov=scaletimellm --cov-report=term-missing --cov-report=xml
      - name: End-to-end smoke sweep
        run: make smoke SMOKE_OUT=results
      - name: Assert smoke summary
        run: test -f results/summary.json
      - name: Upload smoke summary
        uses: actions/upload-artifact@v4
        with:
          name: smoke-summary-py${{ matrix.python-version }}
          path: |
            results/summary.json
            results/REPORT.md
            results/aggregate.csv
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-py${{ matrix.python-version }}
          path: coverage.xml
